<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Audio Player</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent!important;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.wrap{display:flex;align-items:center;justify-content:center;height:100%}
.err{font-size:13px;color:rgba(255,120,120,0.9);text-align:center;padding:20px;display:none}
.err.show{display:block}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<div class="err" id="err">⚠️ Audio not found. Open this URL in the browser where you generated it.</div>
<script>
// This file is a fallback — real players are generated and uploaded per-track.
// If someone opens this directly, show error.
document.getElementById('err').classList.add('show');
document.getElementById('wrap').style.display = 'none';
</script>
</body></html>
